name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor is 20, not the package's engines floor of 18: the dev toolchain
        # pulls brace-expansion@5 (node "20 || >=22") and serialize-javascript@7
        # (node >=20). Consumers are unaffected -- neither ships in the tarball.
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm test

  consumer-smoke:
    name: Consumer install (engines floor, Node 18)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Pack the tarball
        run: npm pack --pack-destination "$RUNNER_TEMP"

      # Prove the published artifact actually runs on the engines floor we
      # advertise. Only production deps are installed, matching a real consumer.
      - uses: actions/setup-node@v7
        with:
          node-version: "18"

      - name: Install and exercise the tarball
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p consumer && cd consumer
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/mitchallen-pen-svg-*.tgz --omit=dev
          node -e "
            const svg = require('@mitchallen/pen-svg').create({}).getSVG({});
            if (!svg.startsWith('<svg')) throw new Error('unexpected output: ' + svg);
            console.log('consumer smoke test passed on ' + process.version);
          "

  publish:
    name: Publish to GitHub Packages
    needs: [test, consumer-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Deliberately no registry-url/scope here. Scope-to-registry mapping is
      # per-scope, so pointing @mitchallen at GitHub Packages would break
      # `npm ci` -- @mitchallen/demand and @mitchallen/fuse-svg-path are only
      # published on npmjs. Auth for the publish step is configured separately.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Verify the tag matches package.json
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi
          echo "Tag and package.json agree on ${PKG_VERSION}"

      - name: Verify tarball contents
        run: |
          node -e "
            const { execSync } = require('node:child_process');
            const allowed = new Set(['index-factory.js', 'package.json', 'README.md', 'LICENSE']);
            const files = JSON.parse(execSync('npm pack --dry-run --json').toString())[0]
              .files.map(f => f.path);
            const unexpected = files.filter(f => !allowed.has(f));
            if (unexpected.length) {
              console.error('Unexpected files in tarball: ' + unexpected.join(', '));
              process.exit(1);
            }
            if (!files.includes('index-factory.js')) {
              console.error('Entry point index-factory.js is missing from the tarball');
              process.exit(1);
            }
            console.log('Tarball contents verified: ' + files.join(', '));
          "

      # The token is expanded by npm at read time, so it never lands in a file.
      - name: Authenticate to GitHub Packages
        run: echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> ~/.npmrc

      # Registry target comes from publishConfig.registry in package.json.
      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
