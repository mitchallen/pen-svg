version: 2
# @mitchallen/* packages live on GitHub Packages, which Dependabot can only read
# with a token. Set it once per repo:  gh secret set GH_PACKAGES_TOKEN --app dependabot
registries:
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.GH_PACKAGES_TOKEN}}
updates:
  # Keep the dev toolchain's lockfile current so patched transitive versions
  # land before an advisory fires.
  - package-ecosystem: npm
    directory: /
    registries:
      - github-packages
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
